# Render Blueprint for the demo-store scrape-target site. Deployed as its own Render
# Project, deliberately separate from clever-consumer-backend/-frontend (see
# repo root README "Deployment" section) so redeploys here never touch the real app.
#
# Before first deploy: reuse the same Postgres instance the main app uses (Neon or
# Supabase both work) and run `psql "$DATABASE_URL" -f demo-store/db/schema.sql`
# against it once. If using Supabase, use the CONNECTION POOLER string, not the direct
# `db.<ref>.supabase.co` host -- see the root render.yaml's comment for why (IPv6-only,
# unreachable from Render's compute).

services:
  - type: web
    name: demo-store
    runtime: node
    rootDir: demo-store
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # same Postgres instance as the main app; this service only touches the demo_store schema (Supabase: use the pooler string)
      - key: ROTATE_EVERY_N
        value: "4"
      - key: DEFAULT_CURRENCY
        value: INR
      - key: STORE_BRAND_NAME
        value: Stridex Market
      - key: ADMIN_TOKEN
        sync: false # optional
